# yaml-language-server: $schema=rig.schema.json
# Minimal bring-up variant of rig-multi-sensor.yaml: one SHT4x on the chamber, wired
# directly to I2C (`sht4x`) instead of one of three in a bank (`sht4x_set`,
# rig-multi-sensor.yaml's `hum_sensors`). No dry/wet line sensors: the blender's
# supply inputs are bound to numbers instead. Same pumps, same controller, same
# addresses otherwise.
#
#   flyball-runner rig-single-sensor.yaml

name: humidity-single-sensor
extends: [blender.yaml]                    # the pump blender and its PWM chip

links:
  i2c1: { type: i2c, bus: 1 }

devices:
  chamber_sensor:                          # chamber_sensor.humidity/.temperature [RP]
    driver: sht4x
    label: Chamber sensor
    poll_s: 1
    link: i2c1
    address: 0x44
    signals:
      humidity: { label: Chamber humidity }
      temperature: { label: Chamber temperature }

  blender:                                 # declared in blender.yaml; here only its inputs
    # Measured 22 Sep on the real rig -- each pump run alone at full effort until the
    # chamber's own reading settled. Supersedes an earlier guess (35/90.5).
    inputs: { dry: 36.5, wet: 88.5 }         # %RH: no line sensors, so numbers

controllers:
  blender.humidity:
    measured: chamber_sensor.humidity
    law: { type: PI, kp: 0.8, ki: 0.02, tt: 60 }
    default: true
