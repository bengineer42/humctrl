# Publishes the book to GitHub Pages, rebuilt from main on every push.
# One-off setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build the book
        run: |
          uv sync --group docs
          uv run --group docs mkdocs build -f book/mkdocs.yml --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
