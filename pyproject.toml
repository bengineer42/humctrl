[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "humidity"
version = "0.1.0"
description = "Split-range humidity control rig built on flyball: rig.yaml, the dual-pump blender, and a CLI"
requires-python = ">=3.12"
authors = [{ name = "Ben Laurence" }]
# The I2C bus (sht4x/sht4x_set) and the PWM chip (the blender's pumps) are
# both flyball-linux's: this rig has no hardware driver of its own left,
# only dual_pump_blender (its split-range arithmetic) and
# sim_humidity_chamber (its simulated plant).
dependencies = ["flyball[web]", "flyball-linux[i2c]"]

classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
# humidity.cli is a pure HTTP client for the runner: no hardware libraries.
cli = ["httpx>=0.27"]

# What `flyball rig check`, the runner and the schema load to make
# `dual_pump_blender` and `sim_humidity_chamber` valid tags in a rig file
# (`i2c`, `sht4x`, `sht4x_set`, `pwm` come from flyball-linux's own entry point).
[project.entry-points."flyball.configs"]
humidity = "humidity"

[project.scripts]
# The generic `flyball-runner` (from `flyball` itself) serves this rig --
# `flyball-runner rig.yaml` (real) or `flyball-runner rig.yaml sim.yaml`
# (no hardware) -- importing `programs/`/`tunings/` beside the rig file
# automatically; humidity has no runner of its own to add to that.
humidity = "humidity.cli:main"

[tool.uv.sources]
flyball = { path = "../../engine", editable = true }
flyball-linux = { path = "../../linux", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/humidity"]

[tool.ruff]
extend = "../../engine/pyproject.toml"
src = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["humidity"]
strict = true
warn_unreachable = true

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
