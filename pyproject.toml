[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "humidity"
version = "0.1.0"
description = "Split-range humidity control rig built on flyball: rig.yaml, the dual-pump blender, and a CLI"
requires-python = ">=3.12"
authors = [{ name = "Ben Laurence" }]
# The I2C bus (flyball-linux) and the sht4x/sht4x_set chip driver
# (flyball-chips, protocol-level) are separate packages since the
# extensions/ restructure; the PWM link/chip is still flyball-linux's.
# This rig has no hardware driver of its own left, only dual_pump_blender
# (its split-range arithmetic) and sim_humidity_chamber (its simulated plant).
dependencies = ["flyball[web]", "flyball-linux[i2c]", "flyball-chips"]

classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
# humidity.cli is a pure HTTP client for the runner: no hardware libraries.
cli = ["httpx>=0.27"]

# What `flyball rig check`, the runner and the schema load to make
# `dual_pump_blender` and `sim_humidity_chamber` valid tags in a rig file
# (`i2c`, `pwm` come from flyball-linux's own entry point; `sht4x`/`sht4x_set`
# from flyball-chips's).
[project.entry-points."flyball.configs"]
humidity = "humidity.configs"

[project.scripts]
# The generic `flyball-runner` (from `flyball` itself) serves this rig --
# `flyball-runner rig.yaml` (real) or `flyball-runner rig.yaml sim.yaml`
# (no hardware) -- importing `programs/`/`tunings/` beside the rig file
# automatically; humidity has no runner of its own to add to that.
humidity = "humidity.cli:main"

[tool.uv.sources]
# Pinned to a commit, not the local path: this repo (humctrl) is its own git repo, split out of
# flyball's examples/humidity, and must resolve standalone from a fresh clone, not just from
# still happening to sit nested inside a flyball checkout. Bump the rev by hand when flyball
# moves and this needs to follow.
flyball = { git = "https://github.com/bengineer42/flyball", rev = "f0ca0383c8570fa6c3eff7b39d9344b6b27a393a", subdirectory = "engine" }
flyball-linux = { git = "https://github.com/bengineer42/flyball", rev = "f0ca0383c8570fa6c3eff7b39d9344b6b27a393a", subdirectory = "extensions/linux" }
flyball-chips = { git = "https://github.com/bengineer42/flyball", rev = "f0ca0383c8570fa6c3eff7b39d9344b6b27a393a", subdirectory = "extensions/chips" }

[tool.hatch.build.targets.wheel]
packages = ["src/humidity"]

[tool.ruff]
extend = "../../engine/pyproject.toml"
src = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["humidity"]
strict = true
warn_unreachable = true

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
