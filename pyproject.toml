[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "humidity"
version = "0.1.0"
description = "Split-range humidity control rig built on flyball: rig-multi-sensor.yaml and the dual-pump blender"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ben Laurence" }]
# The I2C bus (flyball-linux) and the sht4x/sht4x_set chip driver
# (flyball-chips, protocol-level) are separate packages since the
# extensions/ restructure; the PWM link/chip is still flyball-linux's.
# This rig has no hardware driver of its own left, only dual_pump_blender
# (its split-range arithmetic) and sim_humidity_chamber (its simulated plant).
dependencies = ["flyball[server]", "flyball-linux[i2c]", "flyball-chips"]

# Not for PyPI: this is one rig's application, not a library. MIT still
# governs the code -- the classifier only stops an accidental upload.
classifiers = ["Private :: Do Not Upload"]

# What `flyball rig check`, the runner and the schema load to make
# `dual_pump_blender` and `sim_humidity_chamber` valid tags in a rig file
# (`i2c`, `pwm` come from flyball-linux's own entry point; `sht4x`/`sht4x_set`
# from flyball-chips's).
[project.entry-points."flyball.configs"]
humidity = "humidity.configs"

# The generic `flyball-runner` (from `flyball` itself) serves this rig --
# `flyball-runner rig-multi-sensor.yaml` (real) or `flyball-runner rig-multi-sensor.yaml sim.yaml`
# (no hardware) -- importing `programs/`/`tunings/` beside the rig file
# automatically. The daemon's own `flyball` CLI (Go, `daemon/cmd/flyball`) is the generic
# command-line client for a running runner -- `flyball read`/`demand`/`status`/`watch`/`invoke`
# -- so this package has no CLI of its own any more (removed 22 Sep: `humidity.cli` duplicated
# it with no capability the Go one lacks).

[tool.uv.sources]
# Pinned to a commit, not the local path: this repo (humctrl) is its own git repo, split out of
# flyball's examples/humidity, and must resolve standalone from a fresh clone, not just from
# still happening to sit nested inside a flyball checkout. Bump the rev by hand when flyball
# moves and this needs to follow.
#
# Pinned to `main`'s tip (23 Sep): flyball went MIT, `dev-merge` was pushed to `dev` and
# `main` together, and the `web` extra became `server` -- hence `flyball[server]` above.
# An older rev does not have that extra, so the two must move together.
flyball = { git = "https://github.com/bengineer42/flyball", rev = "62733c3c0ff90b10cdcc345b6483a9f9ce350ef7", subdirectory = "engine" }
flyball-linux = { git = "https://github.com/bengineer42/flyball", rev = "62733c3c0ff90b10cdcc345b6483a9f9ce350ef7", subdirectory = "extensions/linux" }
flyball-chips = { git = "https://github.com/bengineer42/flyball", rev = "62733c3c0ff90b10cdcc345b6483a9f9ce350ef7", subdirectory = "extensions/chips" }

[tool.hatch.build.targets.wheel]
packages = ["src/humidity"]

[tool.ruff]
extend = "../../engine/pyproject.toml"
src = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["humidity"]
strict = true
warn_unreachable = true

[dependency-groups]
dev = ["pytest>=8"]
# book/ is a MkDocs site; mkdocstrings renders the Python reference from docstrings.
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "griffe-pydantic>=1.0",
]
