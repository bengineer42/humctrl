# yaml-language-server: $schema=rig.schema.json
# The pump blender, shared by every humidity rig file (`extends: [blender.yaml]`):
# the PWM chip it drives and the `dual_pump_blender` device on it. A rig file
# adds what differs -- its sensors, the controller that regulates `blender.humidity`
# from one of them, and the blender's `inputs:`, the supply lines' humidity: a
# number each (rig-single-sensor.yaml) or a sensor each (rig-multi-sensor.yaml).
# The blender has no default for them, so this file does not load on its own.
#
# Not a rig on its own: `flyball-runner blender.yaml` has no sensor to regulate from,
# and no supply humidities.
#
# runner.front is how `flyball run` serves the rig: the dashboard and the door on :8000, the
# runner behind it on a socket, started through this project's venv (`uv`). `auth: password`
# needs a `password:` -- a `$scrypt$` line from `flyball password` -- which is not kept here:
# put it in a deployment overlay outside the checkout (book: 4-hardware/pi.md), with anything
# else this one rig differs by, and run `flyball run rig-single-sensor.yaml ~/humidity-pi.yaml`.
# Without one the front falls back to the local shape, on loopback only, and says why.

runner:
  port: 8001                               # a bare `flyball-runner` only; under `flyball run` it is unused
  front:
    listen: ":8000"
    auth: password
    uv: true

links:
  pwm0: { type: pwm, chip: 0 }

devices:
  blender:                                 # two pumps blended into one settable humidity
    driver: dual_pump_blender
    label: Pump blender
    link: pwm0
    dry: { channel: 0, deadband: 0.05, max_flow: 2.0 }   # L/min
    wet: { channel: 1, deadband: 0.05, max_flow: 2.0 }
    blend_flow: 1.0
    # signals the driver declares (no poll: it pushes from commit and its commands):
    #   humidity                 demand   %RH, limits [dry, wet] from its inputs  the split-range target
    # inputs (each rig file gives them; no default): dry, wet -- each line's humidity, %RH
    #   flows.dry, flows.wet     demand   L/min    read-only readbacks; set only by set_flows;
    #                                              limits [0, dry/wet max_flow]
    #   efforts.dry, efforts.wet demand   0-1 of full read-only readbacks; set only by set_efforts
    #   expected_humidity        readout  %RH                   what the lines actually deliver
    #   mode                     readout  humidity|flows        which demand is in control
    #   blend                    setting  the flow a humidity demand mixes to; set_blend
    # its stop (the Software stop, a shutdown, on_fault stop/stop_device): the `stop`
    # command, both pumps off -- `stop:` values are refused on this device
