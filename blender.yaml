# yaml-language-server: $schema=rig.schema.json
# The pump blender, shared by every humidity rig file (`extends: [blender.yaml]`):
# the PWM chip it drives and the `dual_pump_blender` device on it. A rig file
# adds what differs -- its sensors, the controller that regulates `blender.humidity`
# from one of them, and (rig-multi-sensor.yaml) `bound:` so the blender reads the
# supply lines' humidity instead of assuming dry 0 %RH / wet 100 %RH.
#
# Not a rig on its own: `flyball-runner blender.yaml` has no sensor to regulate from.

links:
  pwm0: { tag: pwm, chip: 0 }

devices:
  blender:                                 # two pumps blended into one settable humidity
    driver: dual_pump_blender
    label: Pump blender
    config:
      link: pwm0
      dry: { channel: 0, deadband: 0.05, max_flow: 2.0 }   # L/min
      wet: { channel: 1, deadband: 0.05, max_flow: 2.0 }
      blend_flow: 1.0
    # signals the driver declares (no poll: it pushes from commit and its commands):
    #   humidity                 demand   %RH, limits [0, 100]  the split-range target; a controller's
    #   flows.dry, flows.wet     demand   L/min                 readbacks; set by set_flows
    #   efforts.dry, efforts.wet demand   0-1 of full           readbacks; set by set_efforts
    #   expected_humidity        output   %RH                   what the lines actually deliver
    #   mode                     output   blend|flows|efforts|stopped
    #   blend                    setting  the flow a humidity demand mixes to; set_blend
    #   max_flows.dry/.wet       config   L/min                 from dry/wet max_flow
