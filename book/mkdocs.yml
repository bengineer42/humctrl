site_name: "Flyball: humidity rig"
site_description: A humidity chamber controlled by flyball on a Raspberry Pi
site_author: Ben Laurence
docs_dir: src
site_dir: ../build/book
strict: true
repo_url: https://github.com/bengineer42/flyball
repo_name: ""          # the logo alone, no text

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  custom_dir: overrides       # main.html: the noai meta tag on every page
  features:
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light }

# Versions: mike deploys each into the gh-pages branch; the theme shows a selector.
extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex: { generic: true }

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [../src, ../../../engine/src]
          options:
            docstring_style: google
            docstring_options: { warn_unknown_params: false, warn_missing_types: false }
            show_source: false
            show_root_heading: true
            show_if_no_docstring: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            extensions:
              - griffe_pydantic: { schema: false }

nav:
  - Introduction: index.md
  - Running the rig:
      - 1-running/index.md
      - First run: 1-running/first-run.md
      - Humidity programs: 1-running/programs.md
      - Autotune on this rig: 1-running/autotune.md
      - Failure modes: 1-running/failures.md
      - Limits: 1-running/limits.md
  - Configuration:
      - 2-config/index.md
  - The rig's devices:
      - 3-devices/index.md
      - "The blender: dual pumps": 3-devices/blender.md
      - "The sensors: SHT4x": 3-devices/sht4x.md
  - Hardware:
      - 4-hardware/index.md
      - Raspberry Pi setup: 4-hardware/pi.md
      - Board and wiring: 4-hardware/board.md
      - Pumps and PWM: 4-hardware/pumps.md
      - Bill of materials: 4-hardware/bom.md
  - Reference:
      - humidity: 5-reference/humidity.md
      - humidity.pumps: 5-reference/humidity/pumps.md
