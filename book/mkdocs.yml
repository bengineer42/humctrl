site_name: "Flyball: humidity rig"
site_description: A humidity chamber controlled by flyball on a Raspberry Pi
site_author: Ben Laurence
docs_dir: src
site_dir: ../build/book
strict: true

theme:
  name: material
  custom_dir: overrides       # main.html: the noai meta tag on every page
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light }

# Versions: mike deploys each into the gh-pages branch; the theme shows a selector.
extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex: { generic: true }

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [../src, ../../../controller/src]
          options:
            docstring_style: google
            docstring_options: { warn_unknown_params: false, warn_missing_types: false }
            show_source: false
            show_root_heading: true
            show_if_no_docstring: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            extensions:
              - griffe_pydantic: { schema: false }

nav:
  - Introduction: index.md
  - Hardware:
      - Raspberry Pi setup: hardware/pi.md
      - Board and wiring: hardware/board.md
      - Pumps and PWM: hardware/pumps.md
      - Bill of materials: hardware/bom.md
  - The rig:
      - Devices and signals: rig/sources.md
      - "The blender device: dual pumps": rig/dual-pumps.md
      - "The sensor device: SHT4x": rig/sht4x.md
      - Configuration: rig/config.md
  - Operating:
      - First run: operating/first-run.md
      - Humidity programs: operating/programs.md
      - Autotune on this rig: operating/autotune.md
      - Failure modes: operating/failures.md
      - Limits: operating/limits.md
  - Reference:
      - humidity: reference/humidity.md
      - humidity.pumps: reference/humidity/pumps.md
